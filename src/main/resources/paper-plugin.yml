main: ${project.groupId}.${java.package.id}.${project.name}
name: ${project.name}
author: SyntaxPhoenix IT-Solutions
version: ${projectVersion}
api-version: 1.21
bootstrapper: com.syntaxphoenix.spigot.smoothtimber.enchant.TimberEnchantBootstrap
softdepend: [BlockyLog, WorldGuard, Residence, Lands, Jobs, GriefPrevention, PlaceholderAPI, CoreProtect, LogBlock, mcMMO, Towny]
dependencies:
  server:
    BlockyLog:
      load: AFTER
      required: false
      join-classpath: true
    CoreProtect:
      load: AFTER
      required: false
      join-classpath: true
    Factions:
      load: AFTER
      required: false
      join-classpath: true
    GriefPrevention:
      load: AFTER
      required: false
      join-classpath: true
    Jobs:
      load: AFTER
      required: false
      join-classpath: true
    Lands:
      load: AFTER
      required: false
      join-classpath: true
    LogBlock:
      load: AFTER
      required: false
      join-classpath: true
    mcMMO:
      load: AFTER
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: AFTER
      required: false
      join-classpath: true
    Residence:
      load: AFTER
      required: false
      join-classpath: true
    Towny:
      load: AFTER
      required: false
      join-classpath: true
    WorldGuard:
      load: AFTER
      required: false
      join-classpath: true
folia-supported: true

permissions:
    smoothtimber.*:
        description: Gives access to all SmoothTimber permissions
        children:
            smoothtimber.limit.*: true
            smoothtimber.use: true
            smoothtimber.toggle: true
            smoothtimber.enchant: true
    smoothtimber.limit.*:
        description: Allows you to break unlimited blocks if the limiter is enabled
        default: op
    smoothtimber.use:
        description: Allows you to use SmoothTimber
        default: true
    smoothtimber.toggle:
        description: Allows you to toggle the TreeCutter of SmoothTimber
        default: true
    smoothtimber.enchant:
        description: Allows you to apply the Timber enchantment with /smoothtimber enchant
        default: op
